<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encrenca! Fichas</title>
<style>
  :root {
    --bg: #1c1a21; --card: #26232d; --card2: #2f2b38; --borda: #3d3748;
    --txt: #f2ece1; --mut: #a8a093; --acc: #e8b04a; --acc-txt: #2a1f08;
    --perigo: #d9503c; --ok: #7ccf7c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 10px 10px 18px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  header h1 { font-size: 16px; margin: 0; color: var(--acc); letter-spacing: .3px; }
  #status { font-size: 12px; color: var(--mut); }
  #status.erro { color: var(--perigo); }
  h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--mut); }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  label { display: block; font-size: 11px; color: var(--mut); flex: 1; min-width: 0; }
  input, select, textarea, button { font: inherit; color: var(--txt); }
  input, select, textarea { width: 100%; background: var(--card2); border: 1px solid var(--borda);
    border-radius: 7px; padding: 6px 8px; margin-top: 2px; }
  input:disabled, select:disabled, textarea:disabled { opacity: .75; }
  textarea { resize: vertical; min-height: 54px; }
  input[type=number] { text-align: center; padding: 6px 2px; }
  .linha { display: flex; gap: 8px; margin-bottom: 6px; }
  .linha:last-child { margin-bottom: 0; }
  .nivel { display: block; margin-top: 2px; padding: 6px 0; text-align: center; font-weight: 700; color: var(--acc); }
  button { background: var(--card2); border: 1px solid var(--borda); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--acc); }
  button:disabled { opacity: .5; cursor: default; }
  button.principal { background: var(--acc); color: var(--acc-txt); border-color: var(--acc); font-weight: 600; }
  .acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .attr { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .attr:last-child { margin-bottom: 0; }
  .attr span { width: 64px; font-weight: 600; }
  .attr input { width: 64px; margin: 0; }
  .attr button { padding: 6px 9px; }
  .attr .rolar { margin-left: auto; }
  .opcoes { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .opcoes select { width: auto; margin: 0; }
  .opcoes label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--txt); flex: none; }
  .opcoes input { width: auto; margin: 0; }
  .vital { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .vital:last-child { margin-bottom: 0; }
  .vital b { width: 64px; }
  .vital input { width: 56px; margin: 0; }
  .vital button { width: 30px; padding: 4px 0; }
  .dados { display: flex; flex-wrap: wrap; gap: 6px; }
  .aviso { background: #3b3220; border: 1px solid var(--acc); color: #ffe7b3; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 8px; }
  .vazio { text-align: center; padding: 22px 8px; color: var(--mut); }
  .vazio button { margin-top: 10px; }
  .dica { font-size: 12px; color: var(--mut); margin: 6px 0 0; }
  #resumo { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 4px; }
  .chip { flex: 0 0 auto; min-width: 118px; text-align: left; padding: 6px 8px; }
  .chip.sel { border-color: var(--acc); background: #3a3120; }
  .chip.sem { opacity: .65; }
  .chip small { display: block; color: var(--mut); }
  .chip strong { display: block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { margin-bottom: 8px; }
  #log div { background: var(--card); border-left: 3px solid var(--acc); border-radius: 6px;
    padding: 5px 8px; margin-bottom: 4px; font-size: 13px; }
  #log div.nat1 { border-left-color: var(--perigo); }
  #rodape { font-size: 12px; color: var(--mut); margin-top: 6px; }
  #rodape .alerta { color: var(--perigo); }
</style>
</head>
<body>
  <header>
    <h1>ENCRENCA! · Fichas</h1>
    <span id="status"></span>
  </header>
  <div id="resumo"></div>
  <div id="log"></div>
  <main id="app"><div class="vazio">Conectando ao Owlbear Rodeo…</div></main>
  <div id="rodape"></div>
  <datalist id="lista-racas"></datalist>
  <datalist id="lista-classes"></datalist>

  <script src="https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/dist/obr.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
